<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Harsh 97</title>
  <meta name="description" content="Harsh Parikh — AI researcher & venture scout. A portfolio, dressed up as a Windows-97 desktop." />
  <meta name="theme-color" content="#008080" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='4' width='26' height='17' fill='%23c0c0c0' stroke='%23000'/%3E%3Crect x='5' y='6' width='22' height='12' fill='%23008080' stroke='%23000'/%3E%3Crect x='7' y='24' width='18' height='5' fill='%23c0c0c0' stroke='%23000'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles/98.css" />
  <link rel="stylesheet" href="styles/desktop.css" />
</head>
<body>
  <!-- Boot splash (visible immediately, before JS runs, to avoid a flash) -->
  <div id="boot" class="boot">
    <div class="boot-inner">
      <div class="boot-logo">
        <svg class="boot-flag" viewBox="0 0 40 32" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" aria-hidden="true">
          <path d="M4 7 L17 5 L17 16 L4 16 Z" fill="#ff3b30"/>
          <path d="M19 4.7 L32 3 L32 16 L19 16 Z" fill="#3fca57"/>
          <path d="M4 18 L17 18 L17 29 L4 27 Z" fill="#37a7f0"/>
          <path d="M19 18 L32 18 L32 28 L19 30 Z" fill="#ffc224"/>
        </svg>
        <div class="boot-word">Harsh<span>97</span></div>
      </div>
      <div class="boot-bar"><i></i></div>
      <div class="boot-tip">Starting Harsh&nbsp;97&hellip;</div>
      <div class="boot-skip">click anywhere to skip</div>
    </div>
  </div>

  <!-- Desktop -->
  <main id="desktop" aria-label="Desktop">
    <div id="icons" class="icons" role="list" aria-label="Desktop icons"></div>
    <div id="windows"></div>
  </main>

  <!-- Screensaver -->
  <canvas id="screensaver" hidden aria-hidden="true"></canvas>

  <!-- Context menu -->
  <ul id="contextmenu" class="context-menu" role="menu" hidden></ul>

  <!-- Start menu -->
  <div id="startmenu" class="start-menu" role="menu" hidden></div>

  <!-- Assistant -->
  <div id="assistant" class="assistant" hidden>
    <div class="assistant-bubble" role="status"></div>
    <button class="assistant-body" aria-label="Desktop assistant"></button>
  </div>

  <!-- Shut-down overlay -->
  <div id="shutdown" class="shutdown" hidden>
    <div class="shutdown-msg">
      <p>It&rsquo;s now safe to turn off<br />your computer.</p>
      <button id="restartBtn">Restart</button>
    </div>
  </div>

  <!-- Taskbar -->
  <footer id="taskbar" class="taskbar">
    <button id="startBtn" class="start-btn" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 40 32" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" aria-hidden="true">
        <path d="M4 7 L17 5 L17 16 L4 16 Z" fill="#ff3b30"/>
        <path d="M19 4.7 L32 3 L32 16 L19 16 Z" fill="#3fca57"/>
        <path d="M4 18 L17 18 L17 29 L4 27 Z" fill="#37a7f0"/>
        <path d="M19 18 L32 18 L32 28 L19 30 Z" fill="#ffc224"/>
      </svg>
      <b>Start</b>
    </button>
    <div id="tasks" class="tasks" role="list" aria-label="Open windows"></div>
    <div class="tray">
      <button id="sound" class="tray-sound" title="Sound is muted — click to enable" aria-label="Toggle sound"></button>
      <span id="clock" class="tray-clock" title="" aria-label="Clock"></span>
    </div>
  </footer>

  <script src="scripts/content.js"></script>
  <script src="scripts/wm.js"></script>
  <script src="scripts/apps.js"></script>
  <script src="scripts/startmenu.js"></script>
  <script src="scripts/contextmenu.js"></script>
  <script src="scripts/screensaver.js"></script>
  <script src="scripts/assistant.js"></script>
  <script src="scripts/boot.js"></script>
</body>
</html>
